name: Deploy Pacer Studio to GitHub Pages

# Manual only: Actions > "Deploy Pacer Studio to GitHub Pages" > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - run: npm ci
      - run: npm test

      - name: Build with the Pages base path
        run: npm run build
        env:
          # Project pages are served from https://<owner>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/

      # docs/manual.html is written in Artifact format (no doctype, html or head tags) so it can also be published
      # as a claude.ai Artifact; wrap it into a standalone page at /<repo>/manual/.
      - name: Add the manual
        working-directory: .
        run: |
          mkdir -p editor/dist/manual
          {
            printf '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n'
            printf '<meta name="viewport" content="width=device-width, initial-scale=1">\n'
            printf '<meta name="color-scheme" content="dark light">\n'
            cat docs/manual.html
            printf '\n</html>\n'
          } > editor/dist/manual/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: editor/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
